<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram • Daily Trends</title>
  <!-- Font Awesome for Telegram icon (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Global reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0b0b; /* pure black background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    /* main container – no borders, no boxes, just content */
    .landing {
      max-width: 720px;
      width: 100%;
      text-align: center;
      background: transparent; /* fully transparent, black bg from body */
      padding: 1rem 0.5rem;
    }

    /* ----- logo circle (exactly as requested) ----- */
    .logo-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1.8rem auto;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a; /* fallback if image fails */
      transition: transform 0.2s ease;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ----- typography : italic & clean ----- */
    .main-headline {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }

    .main-headline i {
      font-style: italic;
      font-weight: 400;
      color: #f0f0f0;
    }

    .sub-headline {
      font-size: 1.2rem;
      font-weight: 300;
      color: #b0b0b0;
      margin-top: 0.2rem;
      margin-bottom: 1.8rem;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    .sub-headline i {
      font-style: italic;
    }

    /* description – italic text */
    .desc {
      font-size: 1.1rem;
      color: #d0d0d0;
      max-width: 500px;
      margin: 0 auto 2.5rem auto;
      font-style: italic;
      line-height: 1.5;
      padding: 0 0.5rem;
    }

    .desc i {
      font-style: italic;
    }

    /* ----- Telegram button (no box, but we keep it minimal) ----- */
    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0088cc;
      background: linear-gradient(145deg, #0088cc, #0072b0);
      color: white;
      font-size: 1.5rem;
      font-weight: 500;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;         /* fully pill shape, but not a box */
      border: none;
      box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      letter-spacing: 0.3px;
      margin-bottom: 2.8rem;
      font-style: italic;
    }

    .telegram-btn i {
      font-size: 2rem;
      color: white;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .telegram-btn span {
      font-style: italic;
    }

    .telegram-btn:hover {
      transform: scale(1.02);
      background: #0099e0;
      box-shadow: 0 12px 28px rgba(0, 136, 204, 0.5);
    }

    .telegram-btn:active {
      transform: scale(0.96);
    }

    /* trusted badge – italic, no box */
    .trusted {
      font-size: 1.2rem;
      color: #bcbcbc;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
      font-style: italic;
      letter-spacing: 0.4px;
    }

    .trusted i {
      font-style: italic;
    }

    .trusted strong {
      font-weight: 600;
      color: #e0e0e0;
      font-style: normal;
    }

    .sub-meta {
      font-size: 1rem;
      color: #8a8a8a;
      font-style: italic;
      word-spacing: 6px;
      margin-top: 0.2rem;
    }

    .sub-meta i {
      font-style: italic;
    }

    /* small extra italic text (learn more) */
    .learn-italic {
      margin-top: 2.5rem;
      font-size: 1rem;
      color: #6a6a6a;
      font-style: italic;
      letter-spacing: 1px;
      border: none;
      background: transparent;
      padding: 0;
    }

    .learn-italic i {
      font-style: italic;
    }

    /* no box anywhere – remove all borders, outlines */
    a, button, div, p, h1, h2, h3, span {
      border: none;
      outline: none;
      box-shadow: none;
    }

    /* responsive */
    @media (max-width: 500px) {
      .logo-circle {
        width: 110px;
        height: 110px;
      }
      .main-headline {
        font-size: 1.9rem;
      }
      .telegram-btn {
        font-size: 1.2rem;
        padding: 0.75rem 2rem;
        gap: 10px;
      }
      .telegram-btn i {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="landing">

    <!-- circular logo (top) -->
    <div class="logo-circle">
      <img src="https://i.ibb.co/4RvRQJK7/IMG-20260717-201523-354.jpg" alt="Telegram channel logo">
    </div>

    <!-- main heading with italic style (part of text) -->
    <h1 class="main-headline">
      <i>Join Our Private</i><br>
      <span style="font-style: italic; font-weight: 500;">Telegram Channel</span> <i>🙌🏻</i>
    </h1>

    <!-- sub: daily updates -->
    <div class="sub-headline">
      <i>Get Daily Updated , Trend 📉 Analysis & Community Discussion</i>
    </div>

    <!-- description italic -->
    <div class="desc">
      <i>Click to join 👇🏻</i>
    </div>

    <!-- Telegram button (with logo) – you will replace the link later -->
    <a href="#" class="telegram-btn" target="_blank" rel="noopener">
      <i class="fab fa-telegram-plane"></i>
      <span>Join Telegram</span>
    </a>

    <!-- trusted badge – italic -->
    <div class="trusted">
      <i>🙌🏻 Trusted by <strong>16,000+</strong> active members</i>
    </div>
    <div class="sub-meta">
      <i>100% Free | No Spam | Instant Updates</i>
    </div>

    <!-- extra italic "Learn Don't add any box" – exactly as requested -->
    <div class="learn-italic">
      <i>Learn Don't add any box ..</i>
    </div>

  </div>

  <!-- (optional) replace link with your TG link – just edit the href in the <a> above -->
</body>
</html>
